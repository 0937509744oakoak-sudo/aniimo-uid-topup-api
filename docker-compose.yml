services:
  api:
    build: .
    ports: ["3000:3000"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgres://aniimo:${POSTGRES_PASSWORD:-change-me}@db:5432/aniimo_topup
      ANIIMO_VERIFY_URL: ${ANIIMO_VERIFY_URL:-}
      ANIIMO_API_TOKEN: ${ANIIMO_API_TOKEN:-}
      ANIIMO_API_KEY: ${ANIIMO_API_KEY:-}
      MYCARD_CREATE_PAYMENT_URL: ${MYCARD_CREATE_PAYMENT_URL:-}
      MYCARD_MERCHANT_ID: ${MYCARD_MERCHANT_ID:-}
      MYCARD_SECRET: ${MYCARD_SECRET:-}
      MYCARD_CALLBACK_URL: ${MYCARD_CALLBACK_URL:-http://localhost:3000/api/v1/payments/mycard/callback}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aniimo_topup
      POSTGRES_USER: aniimo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: ["postgres_data:/var/lib/postgresql/data", "./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aniimo -d aniimo_topup"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
